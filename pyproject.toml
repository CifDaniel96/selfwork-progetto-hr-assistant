[project]
name = "hr-assistant"
version = "0.1.0"
description = ""
authors = [
    {name = "Daniel Ciferni",email = "cif.daniel96@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "chainlit (>=2.0.5,<3.0.0)",
    "chromadb (>=0.6.3,<0.7.0)",
    "openai (>=1.59.9,<2.0.0)",
